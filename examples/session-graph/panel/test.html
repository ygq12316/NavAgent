<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>会话地图（桥模拟测试）</title>
<script>
  // ── 桥模拟：graph.js 的 invoke/postMessage 在顶层页面里回到自身，由这里应答 ──
  const CURRENT = 's-2'
  const MOCK_POSITIONS = {}
  const MOCK_SESSIONS = [
    { id: 's-2', projectPath: 'E:/ws', title: '帮我总结调研报告', createdAt: Date.now() - 1800_000, updatedAt: Date.now() - 6 * 60_000, model: 'deepseek-chat' },
    { id: 's-3', projectPath: 'E:/ws', title: '帮我总结调研报告（fork）', createdAt: Date.now() - 1800_000, updatedAt: Date.now() - 3.5 * 60_000, model: 'deepseek-chat', forkSourceId: 's-2', forkNodeId: 'a' },
    { id: 's-5', projectPath: 'E:/ws', title: '二级派生：事件协议专攻', createdAt: Date.now() - 1800_000, updatedAt: Date.now() - 2 * 60_000, model: 'deepseek-chat', forkSourceId: 's-3', forkNodeId: 'j' },
    { id: 's-6', projectPath: 'E:/ws', title: '二级派生：测试策略', createdAt: Date.now() - 1800_000, updatedAt: Date.now() - 2.5 * 60_000, model: 'deepseek-chat', forkSourceId: 's-3', forkNodeId: 'h' },
    { id: 's-1', projectPath: 'E:/ws', title: '空会话', createdAt: Date.now() - 1800_000, updatedAt: Date.now() - 1800_000, model: 'deepseek-chat' },
    { id: 's-4', projectPath: 'E:/ws', title: '修复登录超时 bug', createdAt: Date.now() - 1800_000, updatedAt: Date.now() - 5 * 60_000, model: 'deepseek-chat' }
  ]

  window.addEventListener('message', (e) => {
    const d = e.data
    if (!d || typeof d.__navagentPanel !== 'string' || d.kind !== 'invoke') return
    setTimeout(() => {
      let result = null
      if (d.op === 'mapData') result = { sessions: MOCK_SESSIONS, currentId: CURRENT, positions: MOCK_POSITIONS }
      if (d.op === 'savePositions') { Object.assign(MOCK_POSITIONS, d.params.positions); result = 'ok' }
      if (d.op === 'open') result = d.params.sessionId
      if (d.op === 'branch') {
        const nid = 's-fork-' + Date.now()
        MOCK_SESSIONS.push({ id: nid, projectPath: 'E:/ws', title: (MOCK_SESSIONS.find(x => x.id === d.params.sessionId)?.title ?? '?') + '（fork）', createdAt: Date.now(), updatedAt: Date.now(), model: 'deepseek-chat', forkSourceId: d.params.sessionId, forkNodeId: 'x' })
        result = nid
      }
      if (d.op === 'remove') {
        const i = MOCK_SESSIONS.findIndex(x => x.id === d.params.sessionId)
        if (i >= 0) MOCK_SESSIONS.splice(i, 1)
        for (const x of MOCK_SESSIONS) if (x.forkSourceId === d.params.sessionId) { delete x.forkSourceId; delete x.forkNodeId }
        result = 'ok'
      }
      window.postMessage({ __navagentPanel: d.__navagentPanel, kind: 'result', reqId: d.reqId, ok: true, result }, '*')
    }, 120)
  })
</script>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #101012; color: #e6e9ef; font: 12px/1.5 "Segoe UI", system-ui, sans-serif; user-select: none; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  #bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.08); color: #9aa1ad; font-size: 11px; }
  #bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #5f7569; }
  #wrap { flex: 1; position: relative; overflow: auto; min-height: 0; }
  #canvas { position: relative; transform-origin: 0 0; }
  #content { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #underlay { position: absolute; left: 0; top: 0; pointer-events: none; }
  #underlay path { stroke: #5c6068; stroke-width: 1.5; fill: none; }
  #cards { position: absolute; left: 0; top: 0; }
  #listToggle { position: absolute; top: 40px; left: 10px; z-index: 21; padding: 3px 10px; border: 1px solid #2a2a2f; background: rgba(21,21,23,.94); color: #9aa1ad; border-radius: 6px; cursor: pointer; font-size: 11px; }
  #listToggle:hover { color: #e6e9ef; border-color: #4a4a52; }
  #list { position: absolute; top: 72px; left: 10px; z-index: 20; width: 216px; max-height: calc(100% - 88px); display: flex; flex-direction: column; background: rgba(16,16,18,.94); border: 1px solid #2a2a2f; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.5); overflow: hidden; }
  #list.hidden { display: none; }
  #list .list-title { flex: none; padding: 7px 10px 5px; color: #626a78; font-size: 10px; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,.06); }
  #listItems { overflow-y: auto; padding: 5px; }
  .list-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 8px; border-radius: 6px; cursor: pointer; color: #9aa1ad; }
  .list-item:hover { background: #1e1e21; color: #e6e9ef; }
  .list-item.on { background: rgba(95,117,105,.18); color: #a8c2b3; }
  .list-item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item.cur .nm::after { content: ' ●'; color: #508ca8; font-size: 8px; }
  .list-item .tm { flex: none; color: #626a78; font-size: 9px; }
  .list-item .fk { flex: none; color: #c3a061; font-size: 9px; }
  #zoomctl { position: absolute; right: 12px; bottom: 12px; z-index: 20; display: flex; gap: 4px; }
  #zoomctl button { width: 28px; height: 26px; border: 1px solid #2a2a2f; background: rgba(21,21,23,.94); color: #9aa1ad; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1; }
  #zoomctl button:hover { color: #e6e9ef; border-color: #4a4a52; }
  #zoomPct { position: absolute; right: 16px; bottom: 44px; z-index: 20; color: #626a78; font-size: 10px; }
  .card { position: absolute; width: 260px; height: 96px; display: flex; flex-direction: column; background: #151517; border: 1px solid #2a2a2f; border-radius: 10px; padding: 10px 12px 8px; cursor: grab; touch-action: none; }
  .card:active { cursor: grabbing; }
  .card:hover { border-color: #4a4a52; }
  .card.current { border-color: #5f7569; }
  .card.archived { opacity: 0.55; }
  .card.selected { border-color: #c3a061; }
  .card.dragging { opacity: 0.85; box-shadow: 0 10px 30px rgba(0,0,0,.55); z-index: 5; }
  .card-head { display: flex; align-items: center; gap: 6px; }
  .card-head .dot { width: 7px; height: 7px; border-radius: 50%; background: #508ca8; flex: none; }
  .card-title { font-size: 12px; font-weight: 600; color: #e6e9ef; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-meta { color: #626a78; font-size: 10px; margin: 2px 0 6px; }
  .card-ops { display: flex; gap: 6px; border-top: 1px solid rgba(255,255,255,.06); padding-top: 6px; margin-top: auto; }
  .card-ops button.danger:hover { color: #d87656; border-color: #d87656; }
  button { border: 1px solid rgba(255,255,255,.15); background: #101012; color: #9aa1ad; border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 11px; }
  button:hover { color: #e6e9ef; border-color: #5f7569; }
  #err { color: #d87656; padding: 8px 10px; display: none; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="bar"><span class="dot"></span><span id="stat">加载中…</span><span class="leaf" id="leafInfo"></span></div>
<div id="wrap">
  <div id="canvas">
    <div id="content">
      <svg id="underlay" width="100%" height="100%"></svg>
      <div id="cards"></div>
    </div>
  </div>
  <div id="err"></div>
</div>
<button id="listToggle">☰ 会话</button>
<div id="list">
  <div class="list-title">项目会话（点击聚焦）</div>
  <div id="listItems"></div>
</div>
<div id="zoomPct">100%</div>
<div id="zoomctl">
  <button id="zIn" title="放大">＋</button>
  <button id="zOut" title="缩小">－</button>
  <button id="zFit" title="重置">1:1</button>
</div>
<script type="module" src="./graph.js"></script>
</body>
</html>
