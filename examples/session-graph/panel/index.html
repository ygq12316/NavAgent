<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>会话地图</title>
<style>
  :root {
    color-scheme: dark;
    /* 暗色令牌（默认） */
    --bg: #101012;
    --surface: #151517;
    --surface-hi: #1e1e21;
    --overlay: rgba(21, 21, 23, 0.94);
    --bd: #2a2a2f;
    --bd-hi: #4a4a52;
    --tx: #e6e9ef;
    --dim: #9aa1ad;
    --faint: #626a78;
    --edge: #5c6068;
    --acc: #5f7569;
    --acc-soft: rgba(95, 117, 105, 0.18);
    --acc-tx: #a8c2b3;
    --blue: #508ca8;
    --gold: #c3a061;
    --bad: #d87656;
    --bar-line: rgba(255, 255, 255, 0.08);
    --btn-bg: #101012;
    --btn-bd: rgba(255, 255, 255, 0.15);
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  }
  :root[data-theme='light'] {
    color-scheme: light;
    --bg: #f7f9fc;
    --surface: #ffffff;
    --surface-hi: #eef1f6;
    --overlay: rgba(255, 255, 255, 0.96);
    --bd: #d8dee8;
    --bd-hi: #b9c2ce;
    --tx: #1b2230;
    --dim: rgba(27, 34, 48, 0.62);
    --faint: rgba(27, 34, 48, 0.45);
    --edge: #c3cbd7;
    --acc: #3f6b52;
    --acc-soft: rgba(63, 107, 82, 0.14);
    --acc-tx: #2e5240;
    --blue: #3d6e86;
    --gold: #9a7c42;
    --bad: #a8445c;
    --bar-line: rgba(27, 34, 48, 0.08);
    --btn-bg: #ffffff;
    --btn-bd: rgba(27, 34, 48, 0.18);
    --shadow: 0 8px 28px rgba(23, 32, 48, 0.14);
  }
  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--tx);
    font: 12px/1.5 "Segoe UI", system-ui, sans-serif;
    user-select: none;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  #bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--bar-line);
    color: var(--dim);
    font-size: 11px;
  }
  #bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); }
  #wrap { flex: 1; position: relative; overflow: auto; min-height: 0; }
  #canvas { position: relative; transform-origin: 0 0; }
  #content { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #underlay { position: absolute; left: 0; top: 0; pointer-events: none; }
  #underlay path { stroke: var(--edge); stroke-width: 1.5; fill: none; }
  #cards { position: absolute; left: 0; top: 0; }

  /* ── 左上角悬浮会话列表（不随画布滚动，可折叠） ── */
  #listToggle {
    position: absolute;
    top: 40px;
    left: 10px;
    z-index: 21;
    width: auto;
    padding: 3px 10px;
    border: 1px solid var(--bd);
    background: var(--overlay);
    color: var(--dim);
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
  }
  #listToggle:hover { color: var(--tx); border-color: var(--bd-hi); }
  #list {
    position: absolute;
    top: 72px;
    left: 10px;
    z-index: 20;
    width: 216px;
    max-height: calc(100% - 88px);
    display: flex;
    flex-direction: column;
    background: var(--overlay);
    border: 1px solid var(--bd);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  #list.hidden { display: none; }
  #list .list-title {
    flex: none;
    padding: 7px 10px 5px;
    color: var(--faint);
    font-size: 10px;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--bar-line);
  }
  #listItems { overflow-y: auto; padding: 5px; }
  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--dim);
  }
  .list-item:hover { background: var(--surface-hi); color: var(--tx); }
  .list-item.on { background: var(--acc-soft); color: var(--acc-tx); }
  .list-item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item.cur .nm::after { content: ' ●'; color: var(--blue); font-size: 8px; }
  .list-item .tm { flex: none; color: var(--faint); font-size: 9px; }
  .list-item .fk { flex: none; color: var(--gold); font-size: 9px; }

  /* ── 缩放控件 ── */
  #zoomctl {
    position: absolute;
    right: 12px;
    bottom: 12px;
    z-index: 20;
    display: flex;
    gap: 4px;
  }
  #zoomctl button {
    width: 28px;
    height: 26px;
    border: 1px solid var(--bd);
    background: var(--overlay);
    color: var(--dim);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
  }
  #zoomctl button:hover { color: var(--tx); border-color: var(--bd-hi); }
  #zoomPct {
    position: absolute;
    right: 16px;
    bottom: 44px;
    z-index: 20;
    color: var(--faint);
    font-size: 10px;
  }

  .card {
    position: absolute;
    width: 260px;
    height: 96px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--bd);
    border-radius: 10px;
    padding: 10px 12px 8px;
    cursor: grab;
    touch-action: none;
  }
  .card:active { cursor: grabbing; }
  .card:hover { border-color: var(--bd-hi); }
  .card.current { border-color: var(--acc); }
  .card.archived { opacity: 0.55; }
  .card.selected { border-color: var(--gold); }
  .card.dragging { opacity: 0.85; box-shadow: var(--shadow); z-index: 5; }
  .card-head { display: flex; align-items: center; gap: 6px; }
  .card-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); flex: none; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-meta { color: var(--faint); font-size: 10px; margin: 2px 0 6px; }
  .card-ops {
    display: flex;
    gap: 6px;
    border-top: 1px solid var(--bar-line);
    padding-top: 6px;
    margin-top: auto;
  }
  .card-ops button.danger:hover { color: var(--bad); border-color: var(--bad); }
  button {
    border: 1px solid var(--btn-bd);
    background: var(--btn-bg);
    color: var(--dim);
    border-radius: 6px;
    padding: 2px 10px;
    cursor: pointer;
    font-size: 11px;
  }
  button:hover { color: var(--tx); border-color: var(--acc); }
  #err { color: var(--bad); padding: 8px 10px; display: none; white-space: pre-wrap; }
</style>
<script>
  // 启动即跟随宿主主题（iframe src 的 theme 参数）
  const __t = new URLSearchParams(location.search).get('theme')
  if (__t === 'light' || __t === 'dark') document.documentElement.dataset.theme = __t
</script>
</head>
<body>
<div id="bar"><span class="dot"></span><span id="stat">加载中…</span><span class="leaf" id="leafInfo"></span></div>
<div id="wrap">
  <div id="canvas">
    <div id="content">
      <svg id="underlay" width="100%" height="100%"></svg>
      <div id="cards"></div>
    </div>
  </div>
  <div id="err"></div>
</div>
<button id="listToggle">☰ 会话</button>
<div id="list">
  <div class="list-title">项目会话（点击聚焦）</div>
  <div id="listItems"></div>
</div>
<div id="zoomPct">100%</div>
<div id="zoomctl">
  <button id="zIn" title="放大">＋</button>
  <button id="zOut" title="缩小">－</button>
  <button id="zFit" title="重置">1:1</button>
</div>
<script type="module" src="./graph.js"></script>
</body>
</html>
